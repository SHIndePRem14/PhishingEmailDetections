{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="fa-solid fa-shield-halved fa-3x mb-3" style="color: var(--accent);"></i>
  <h1 class="display-4">404</h1>
  <h4>Page Not Found</h4>
  <p class="text-muted">The page you're looking for doesn't exist.</p>
  <a href="{{ url_for('auth.login') }}" class="btn btn-phishguard mt-2">Back to Login</a>
</div>
{% endblock %}
