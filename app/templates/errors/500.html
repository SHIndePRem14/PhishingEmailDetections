{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="fa-solid fa-shield-halved fa-3x mb-3" style="color: var(--accent);"></i>
  <h1 class="display-4">500</h1>
  <h4>Server Error</h4>
  <p class="text-muted">Something went wrong on our end. Please try again later.</p>
  <a href="{{ url_for('auth.login') }}" class="btn btn-phishguard mt-2">Back to Login</a>
</div>
{% endblock %}
